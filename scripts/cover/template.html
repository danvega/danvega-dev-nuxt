<!doctype html>
<html>
<!--
  Terminal-theme blog cover template (matches the site's terminal design language).
  Copy this file, replace the marked sections, render with scripts/cover/render.mjs.

  Sections to customize per post:
    1. .eyebrow      — mono $-prompt line above the headline
    2. h1            — headline; wrap the accent word in <em> (green) or <em class="warn"> (red)
    3. .chips        — optional row of status pills; delete the whole div if unused
    4. .term-title   — terminal window title bar text
    5. .term-body    — terminal content; use .p ($), .cmd, .ok, .bad, .dim, .accent spans
-->
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: #0c1108;
    --panel: rgba(255, 255, 255, 0.03);
    --line: rgba(155, 224, 107, 0.14);
    --green: #9be06b;
    --green-dim: #6f9d4d;
    --red: #f5486b;
    --fg: #f4f6f0;
    --dim: #8a9382;
    --mono: "SF Mono", Menlo, monospace;
    --sans: Inter, -apple-system, "Helvetica Neue", sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; }
  body {
    background-color: var(--bg);
    background-image:
      radial-gradient(1200px 700px at 50% -10%, rgba(155, 224, 107, 0.10), transparent 70%),
      linear-gradient(rgba(155, 224, 107, 0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(155, 224, 107, 0.035) 1px, transparent 1px);
    background-size: auto, 72px 72px, 72px 72px;
    font-family: var(--sans);
    color: var(--fg);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .wrap {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 56px;
    padding: 80px;
  }
  .eyebrow {
    font-family: var(--mono);
    font-size: 40px;
    color: var(--green);
    letter-spacing: 0.02em;
  }
  .eyebrow .p { color: var(--green-dim); margin-right: 18px; }
  h1 {
    font-size: 148px;
    font-weight: 800;
    letter-spacing: -0.025em;
    text-align: center;
    line-height: 1.05;
  }
  h1 em { font-style: normal; color: var(--green); }
  h1 em.warn { color: var(--red); }
  .chips { display: flex; gap: 28px; }
  .chip {
    font-size: 34px;
    font-weight: 600;
    padding: 18px 36px;
    border: 2px solid var(--line);
    border-radius: 999px;
    background: var(--panel);
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .chip .ok { color: var(--green); }
  .chip .bad { color: var(--red); }
  .term {
    width: 1560px;
    background: rgba(20, 26, 15, 0.85);
    border: 2px solid var(--line);
    border-radius: 24px;
    overflow: hidden;
    box-shadow: 0 40px 120px rgba(0, 0, 0, 0.5);
  }
  .term-bar {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 26px 32px;
    border-bottom: 2px solid var(--line);
  }
  .dot { width: 22px; height: 22px; border-radius: 50%; }
  .dot:nth-child(1) { background: #ff5f57; }
  .dot:nth-child(2) { background: #febc2e; }
  .dot:nth-child(3) { background: #28c840; }
  .term-title { font-family: var(--mono); font-size: 28px; color: var(--dim); margin-left: 14px; }
  .term-body {
    font-family: var(--mono);
    font-size: 40px;
    line-height: 1.85;
    padding: 44px 56px 52px;
    white-space: pre;
  }
  .term-body .p { color: var(--green-dim); }
  .term-body .cmd { color: var(--fg); }
  .term-body .ok { color: var(--green); }
  .term-body .bad { color: var(--red); }
  .term-body .dim { color: var(--dim); }
  .term-body .accent { color: var(--green); font-weight: 700; }
  .cursor {
    display: inline-block;
    width: 22px;
    height: 44px;
    background: var(--green);
    vertical-align: -6px;
    margin-left: 8px;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="eyebrow"><span class="p">$</span>eyebrow text goes here</div>
    <h1>Headline With <em>Accent</em> Word</h1>
    <div class="chips">
      <div class="chip"><span class="ok">✓</span> chip one</div>
      <div class="chip"><span class="ok">✓</span> chip two</div>
      <div class="chip"><span class="ok">✓</span> chip three</div>
    </div>
    <div class="term">
      <div class="term-bar">
        <div class="dot"></div><div class="dot"></div><div class="dot"></div>
        <div class="term-title">~/dev — zsh</div>
      </div>
      <div class="term-body"><span class="p">$</span> <span class="cmd">command --here</span>
<span class="dim">output line</span>       <span class="ok">✓</span>  status
<span class="accent">closing line</span><span class="cursor"></span></div>
    </div>
  </div>
</body>
</html>
